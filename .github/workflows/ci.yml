name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openraise
          POSTGRES_PASSWORD: openraise
          POSTGRES_DB: openraise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openraise"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openraise:openraise@localhost:5432/openraise
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # S3-compatible storage for the image tests. (Service containers can't take
      # a command, so start it here.)
      - name: Start SeaweedFS
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs server -s3 -ip.bind=0.0.0.0
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8333/ && exit 0; sleep 2; done
          echo "SeaweedFS did not start" && exit 1
      - run: pnpm install --frozen-lockfile
      # Don't rely on install scripts having run: generate the Prisma client explicitly.
      - run: pnpm --filter @openraise/api db:generate
      - run: pnpm build:shared
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
