# Local development services. `docker compose up -d` and you have everything
# the API needs. Ports match the defaults in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openraise
      POSTGRES_PASSWORD: openraise
      POSTGRES_DB: openraise
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openraise']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for campaign images (SeaweedFS). S3 API on
  # http://localhost:8333. MinIO no longer publishes community images.
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - '8333:8333'
    volumes:
      - storage-data:/data

  # Catches every email the app sends. Inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  storage-data:
